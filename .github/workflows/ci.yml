name: MasterChat CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-gateway:
    name: Gateway (Go) Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: gateway-go/go.sum

      - name: Go Vet
        run: |
          cd gateway-go
          go vet ./...

      - name: Run Go Tests
        run: |
          cd gateway-go
          go test -v -race ./tests/...

  test-ai-service:
    name: AI Service (Python) Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies
        run: |
          cd ai-service
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python Syntax
        run: |
          cd ai-service
          python -m py_compile app/**/*.py alembic/**/*.py

      - name: Run Pytest
        env:
          ENVIRONMENT: test
          OPENAI_API_KEY: mock-openai-key
          ANTHROPIC_API_KEY: mock-anthropic-key
          ASYNC_DATABASE_URL: sqlite+aiosqlite:///:memory:
          DATABASE_URL: sqlite:///:memory:
        run: |
          cd ai-service
          pytest -v

  build-frontend:
    name: Frontend (Next.js 15) Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm install

      - name: Type Check & Build
        run: |
          cd frontend
          npm run build

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [test-gateway, test-ai-service, build-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Gateway Image
        uses: docker/build-push-action@v5
        with:
          context: ./gateway-go
          file: ./infra/docker/Dockerfile.gateway
          push: false
          tags: masterchat-gateway:latest

      - name: Build AI Service Image
        uses: docker/build-push-action@v5
        with:
          context: ./ai-service
          file: ./infra/docker/Dockerfile.ai-service
          push: false
          tags: masterchat-ai-service:latest

